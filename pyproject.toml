[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-fetch-skill"
version = "3.1.4"
description = "AI-friendly paper fetch tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "cachetools>=6,<8",
  "cloakbrowser>=0.4,<0.5",
  "filetype>=1.2,<2",
  "filelock>=3.20,<4",
  "imagesize>=1.4,<3",
  "idutils>=1.5,<2",
  "mcp>=1.27,<2",
  "platformdirs>=4,<5",
  "python-dotenv>=1.2,<2",
  "rapidfuzz>=3,<4",
  "trafilatura>=2.0,<3",
  "lxml>=6,<7",
  "playwright>=1.47,<2",
  "PyMuPDF>=1.27,<2",
  "pymupdf4llm>=1.27,<2",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4,<5",
  "markdown-it-py>=3,<5",
  "packaging>=24,<27",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
paper-fetch = "paper_fetch.cli:main"
paper-fetch-mcp = "paper_fetch.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_fetch*"]

[tool.setuptools.package-data]
paper_fetch = [
  "resources/**/*.json",
  "resources/**/*.yaml",
  "resources/**/*.yml",
  "resources/**/*.js",
  "resources/**/*.xsl",
  "resources/**/*.xml",
  "resources/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: tests that access live external services",
  "slow: tests that are intentionally slower than normal unit tests",
]

[tool.coverage.run]
branch = true
source = ["paper_fetch"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "scripts"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
